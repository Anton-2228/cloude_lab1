version: '3.9'

services:
  redis:
    image: redis:7.2.4
    env_file: .env
    volumes:
      - redis_data:/data
    command: redis-server --port ${REDIS_PORT} --requirepass ${REDIS_PASSWORD}
    ports:
      - ${REDIS_PORT}:${REDIS_PORT}

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    env_file: .env
    ports:
      - ${APP_PORT}:${APP_PORT}
    volumes:
      - ${LOGGING_DIR}:/logs

networks:
  internal_network:
    internal: true
  external_network:

volumes:
  redis_data:
