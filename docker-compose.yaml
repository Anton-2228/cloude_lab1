version: '3.9'

services:
  edge-broker:
    image: eclipse-mosquitto:2
    container_name: edge-broker
    command: >
      sh -c 'printf "listener 1883 0.0.0.0\nallow_anonymous true\npersistence false\n" >
      /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    ports:
      - "1883:1883"

  cloud-broker:
    image: eclipse-mosquitto:2
    container_name: cloud-broker
    command: >
      sh -c 'printf "listener 1883 0.0.0.0\nallow_anonymous true\npersistence false\n" >
      /mosquitto/config/mosquitto.conf && exec mosquitto -c /mosquitto/config/mosquitto.conf'
    ports:
      - "1884:1883"

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - edge-broker
      - cloud-broker

  sensor:
    build: ./sensor
    container_name: sensor
    depends_on:
      - edge-broker

  cloud-listener:
    build: ./cloud
    container_name: cloud
    depends_on:
      - cloud-broker

volumes:
  nodered_data:
