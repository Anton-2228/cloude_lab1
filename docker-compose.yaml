version: '3.9'

services:
  redis:
    image: redis:7.2.4
    volumes:
      - redis_data:/data
    command: redis-server --port 6380 --requirepass 1234
    ports:
      - 6380:6380

  app:
    image: lab1
    depends_on:
      - redis
    ports:
      - 5000:5000
    volumes:
      - /home/anton/Desktop/облака/lab1/log:/logs

networks:
  internal_network:
    internal: true
  external_network:

volumes:
  redis_data:

